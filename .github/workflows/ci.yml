name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Remote Script copies match
        run: cmp AbletonMCP_Remote_Script/__init__.py MCP_Server/bundled_ableton_remote_script/AbletonMCP_init.py
      - name: Remote Script compiles
        run: python -m py_compile AbletonMCP_Remote_Script/__init__.py
      - name: Unit tests
        run: uv run --frozen --with pytest pytest -q
